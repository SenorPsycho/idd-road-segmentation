seed: 42
data:
  root_dir: Dataset
  image_size: 512
model:
  encoder_name: resnet50
  encoder_weights: imagenet
  classes: 2
train:
  batch_size: 24
  num_epochs: 30
  lr: 0.0001
  weight_decay: 0.0001
  freeze_until_epoch: 3
  num_workers: 6
loss:
  ignore_index: 255
  ce_weight: 0.5
  dice_weight: 0.5
run:
  base_dir: runs
